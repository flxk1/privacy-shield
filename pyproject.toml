[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-shield"
version = "1.0.0"
description = "Local-first PII/PHI detection and clean-overlay pipeline: only a cleaned overlay ever leaves the machine to a cloud LLM."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "flxk1" }]
dependencies = []

[project.optional-dependencies]
# Semantic / contextual PII layer (embeddings + shadow ONNX model)
semantic = ["numpy>=1.24", "onnxruntime>=1.16"]
# Document/media extraction (PDF, images)
extract = ["PyMuPDF>=1.23", "opencv-python-headless>=4.8"]
# Config layer + tests
dev = ["pyyaml>=6", "pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
