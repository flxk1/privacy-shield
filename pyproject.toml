[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-shield"
version = "2.2.0"
description = "Detect PII and PHI locally, produce a clean overlay, and block unsafe egress before content reaches an external model."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "flxk1" }]
dependencies = []

[project.scripts]
privacy-shield = "privacy_shield.cli:main"

[project.optional-dependencies]
# Semantic / contextual PII layer (embeddings + shadow ONNX model)
semantic = ["numpy>=1.24", "onnxruntime>=1.16"]
# Document/media extraction (PDF, images)
extract = ["PyMuPDF>=1.23", "opencv-python-headless>=4.8,<5", "Pillow>=10"]
# OpenAI-compatible client for the embedded/native local-model HTTP path
# (services/local_model_runtime.py). Without it that path degrades to
# "embedded_openai_client_unavailable"; the ..._COMMAND subprocess path is
# unaffected. Required to run tests/test_local_model_endpoint_guard.py's
# send-path assertions rather than skip them.
openai = ["openai>=1"]
# National person-number validators (python-stdnum): 27 EU countries with real
# check digits, instead of per-country regexes we would write and not maintain.
# OFF unless a country is configured - see privacy_shield/national.py and the
# limits document. The base package keeps dependencies = [] and the
# regex/lexicon floor is correct without this.
national = ["python-stdnum>=1.19"]
# Freshness verdict for the hand-maintained national-number table
# (privacy_shield/freshness.py). The pin and the observation are this package's
# own and need nothing; norm-freshness turns them into a verdict. OFF unless
# installed - `freshness.available()` is then False and the verdict is simply
# not offered, while the staleness check itself still runs off `national`.
# The base package keeps dependencies = [].
freshness = ["norm-freshness"]
# Names, street addresses and special-category mentions from a local GLiNER2
# model (privacy_shield/pii_model.py). OFF unless PRIVACY_SHIELD_PII_MODEL names
# a model already on disk; its findings are redacted and never block.
model = ["gliner2>=2.0"]
# Config layer + tests. hypothesis drives the property-based half of the
# leak invariant (tests/test_leak_invariant.py); the deterministic battery
# in the same file runs without it. schwifty is the external IBAN registry
# tests/test_iban_registry.py checks the country/length table against - nothing
# inside this package can notice that table going stale. numpy is needed only
# to collect tests/test_onnx_contextual_pii.py, which exercises the feature
# contract (privacy_shield/onnx_contextual_pii.py) against plain numpy arrays
# and never imports onnxruntime - [dev] alone must be able to collect and run
# the full suite, so numpy lives here rather than in [semantic].
dev = ["pyyaml>=6", "pytest>=7", "hypothesis>=6", "schwifty>=2024", "python-stdnum>=1.19", "tomli>=2; python_version<'3.11'", "numpy>=1.24"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["privacy_shield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
