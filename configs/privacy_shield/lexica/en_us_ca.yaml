  - "my name is"
  - "signed by"
  - "employee name"
  - "customer name"

sensitive_terms:
  health: ["diagnosis", "patient", "prescription", "medical leave", "disability"]
  religion: ["religion", "faith", "church", "mosque", "synagogue", "temple"]
  politics: ["voter", "campaign", "political affiliation", "party registration"]
  union: ["union member", "labor union", "collective bargaining", "shop steward"]
