pack_id: en_us_ca
jurisdictions: [us, ca]
languages: [en]
field_label_semantics: context_only

field_labels:
  name: ["name", "full name", "legal name", "contact"]
  email: ["email", "e-mail"]
  phone: ["phone", "cell", "mobile", "contact number"]
  address: ["address", "street address", "zip code", "postal code", "state", "province"]
  date_of_birth: ["date of birth", "dob", "birthday"]
  health: ["medical", "diagnosis", "patient", "treatment", "hipaa"]
  tax_id: ["ssn", "social security number", "sin", "social insurance number", "tax id", "tin"]

honorifics:
