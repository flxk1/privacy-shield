  email: ["e-mail", "email", "mail"]
  phone: ["telefon", "telefonnummer", "handy", "mobil", "tel"]
  address: ["adresse", "anschrift", "wohnort", "straße", "strasse"]
  date_of_birth: ["geburtsdatum", "geb.", "geboren am"]
