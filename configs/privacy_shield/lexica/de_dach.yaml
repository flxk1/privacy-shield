  criminal: ["vorstrafe", "ermittlungsverfahren", "haftbefehl", "strafregister"]

region_specific_ids:
  - steuer_id
  - svnr

negative_terms:
  - pferd
  - tiger
  - projekt
  - version
  - vertrag
