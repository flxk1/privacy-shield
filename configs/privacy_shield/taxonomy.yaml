version: 1
owner: privacy_shield
source_alignment:
  gdpr:
    direct_identifier_scope:
      - article_4_1
    special_category_scope:
      - article_9_1
  iso:
    - ISO/IEC 29100:2024
    - ISO/IEC 20889:2018
    - ISO/IEC 27561:2024
    - ISO/IEC 27701:2019

entities:
  - id: email
    canonical_name: EMAIL_ADDRESS
    detector_class: direct_identifier
    default_action: redact
    requires_review: false

  - id: phone
    canonical_name: PHONE_NUMBER
    detector_class: direct_identifier
    default_action: redact
    requires_review: false

  - id: iban
    canonical_name: IBAN
    detector_class: direct_identifier
    default_action: redact
    requires_review: false

  - id: credit_card
    canonical_name: PAYMENT_CARD
    detector_class: direct_identifier
    default_action: redact
    requires_review: false

  - id: ip_address
    canonical_name: IP_ADDRESS
    detector_class: direct_identifier
    default_action: redact
    requires_review: false

  - id: steuer_id
    canonical_name: TAX_IDENTIFIER_DE
    detector_class: direct_identifier
    default_action: redact
    requires_review: false

  - id: svnr
    canonical_name: SOCIAL_SECURITY_IDENTIFIER_DE
    detector_class: direct_identifier
    default_action: redact
    requires_review: false

  - id: passport
    canonical_name: PASSPORT_NUMBER
    detector_class: direct_identifier
    default_action: review
    requires_review: true

  - id: id_card
    canonical_name: NATIONAL_ID_CARD
