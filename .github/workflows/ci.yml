name: ci
on:
  push:
    branches-ignore:
      - 'release-please--**'
  pull_request:

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: REUSE / SPDX licensing compliance
        uses: fsfe/reuse-action@ef1dfe28dda4d13f5d580f0444eb27dda9746e9b  # v5

  leak-gate:
    # The release gate. 2.0.0 was rejected because the core emitted raw PII in
    # the payload it certified as safe to send, and 253 green tests did not
    # notice: every one of them asked the scanner what it had found instead of
    # reading the bytes that came out. This invariant reads the bytes. It runs
    # on its own, before anything else, and `tests` does not start until it
    # passes - a leak fails CI under its own name rather than as one line in a
    # 400-test summary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      - name: leak invariant - no PII in a payload cleared for egress
        run: |
          python3 -m pip install ".[dev]"
          python3 -m pytest tests/test_leak_invariant.py -q

  tests:
    needs: leak-gate
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      # 8 tests/test_simplifier.py cases patch privacy_shield.services.llm_runtime,
      # an upstream gateway this package does not ship. Deselected by name, not
      # by dropping the whole module, so the other tests in that file still run.
      # The `openai` extra is installed so
      # tests/test_local_model_endpoint_guard.py's send-path assertions run
      # rather than skip.
      - name: install and test
        run: |
          python3 -m pip install ".[dev,semantic,extract,openai]"
          python3 -m pytest -q \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_llm_simplification_success \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_llm_failure_returns_original \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_llm_empty_result_returns_original \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_llm_short_result_returns_original \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_llm_exception_returns_original \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_german_language \
            --deselect tests/test_simplifier.py::TestSimplifyResponseAsync::test_async_simplification_success \
            --deselect tests/test_simplifier.py::TestSimplifyResponseAsync::test_async_failure_returns_original

  commit-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: commit discipline (new commits only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin ${{ github.base_ref }}
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }} -1"
          fi
          bad=0
          git log --no-merges --format='%s' $range | awk 'length($0)>72 {print "subject >72 chars: " $0; bad=1} END {exit bad}' || bad=1
          if git log --no-merges --format='%(trailers)' $range | grep -iE '^Co-Authored-By:.*(claude|codex|openai|anthropic|copilot|gemini)'; then
            echo "AI co-author trailer found — use the assisted line instead"; bad=1
          fi
          exit $bad
