name: ci
on:
  push:
    branches-ignore:
      - 'release-please--**'
  pull_request:

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: REUSE / SPDX licensing compliance
        uses: fsfe/reuse-action@ef1dfe28dda4d13f5d580f0444eb27dda9746e9b  # v5

  leak-gate:
    # The release gate. 2.0.0 was rejected because the core emitted raw PII in
    # the payload it certified as safe to send, and 253 green tests did not
    # notice: every one of them asked the scanner what it had found instead of
    # reading the bytes that came out. This invariant reads the bytes. It runs
    # on its own, before anything else, and `tests` does not start until it
    # passes - a leak fails CI under its own name rather than as one line in a
    # 400-test summary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      # Every extra, not just [dev]. The gate used to install [dev] alone, so
      # the configuration it certified was not the one anybody runs: with
      # [semantic] present the embedding layer is live and adds Layer-6
      # findings, and with [extract] present documents take a different
      # extraction path. A gate that clears a configuration nobody uses has
      # cleared nothing.
      - name: leak invariant - no PII in a payload cleared for egress
        run: |
          python3 -m pip install ".[dev,semantic,extract,openai]"
          python3 -m pytest tests/test_leak_invariant.py tests/test_iban_registry.py -q

  base-install:
    # `dependencies = []` and the governance block's
    # `degrade_gracefully_without_optional_extras` were claims no job measured:
    # every other job here installs `.[dev,semantic,extract,openai]`, so the
    # configuration a plain `pip install privacy-shield` produces was never
    # built, never imported and never scanned with. The degradation tests that
    # do exist monkeypatch `available()` to False, which simulates absence in a
    # process where the extra is importable - it cannot fail on real coupling.
    #
    # This job installs the base package ALONE, with no extras and no pytest,
    # and exercises the floor through the public API and the CLI. It needs no
    # test dependency by design: the moment this job installs something to
    # check itself with, it stops being a base install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      - name: the base package installs, imports and detects with no extras
        run: |
          python3 -m pip install .
          # Nothing but this package and pip may be present. An extra arriving
          # as somebody's transitive dependency would make every assertion
          # below pass for the wrong reason.
          python3 - <<'PY'
          import importlib.metadata as md
          installed = {d.metadata["Name"].lower() for d in md.distributions()}
          unexpected = installed - {"privacy-shield", "pip", "setuptools", "wheel"}
          assert not unexpected, f"not a base install; also present: {sorted(unexpected)}"
          for extra in ("numpy", "onnxruntime", "fitz", "PIL", "cv2",
                        "openai", "stdnum", "yaml", "schwifty"):
              try:
                  __import__(extra)
              except ImportError:
                  continue
              raise AssertionError(f"{extra} is importable; this is not a base install")
          print("base install confirmed: privacy-shield and nothing else")
          PY
          python3 - <<'PY'
          from privacy_shield import redact_text, scan_text
          from privacy_shield.gate import PrivacyGate

          text = ("Kontakt erika.mustermann@example.com, "
                  "Konto DE89370400440532013000, Karte 4111 1111 1111 1111")
          found = {f.pii_type.value for f in scan_text(text).findings}
          for expected in ("email", "iban", "credit_card"):
              assert expected in found, f"the floor lost {expected}: {sorted(found)}"

          # The overlay is the only thing meant to leave, so read its bytes
          # rather than asking the scanner what it thinks it found.
          overlay = redact_text(text).redacted_text
          compact = overlay.replace(" ", "")
          for original in ("erika.mustermann@example.com",
                           "DE89370400440532013000", "4111111111111111"):
              assert original not in compact, (
                  f"{original} survived redaction in a base install")

          # The gate decides without any extra present.
          blocked = PrivacyGate()._decide_local({"text": "streng vertraulich"}, "openai")
          assert not blocked.allowed, "a confidential document was cleared"
          print("base install: floor detects, overlay is clean, gate decides")
          PY
          # The console script ships in the base install, so it has to run
          # there. Exit 2 means "at least one document blocked" and is a
          # success for this probe; anything else is a failure.
          printf 'Kontakt erika.mustermann@example.com\n' > base-probe.txt
          privacy-shield scan base-probe.txt --json > base-out.json \
            || test $? -eq 2
          grep -q '"pii_type": "email"' base-out.json \
            || (echo "the CLI found no email in a base install"; cat base-out.json; exit 1)
          # The OVERLAY is the only thing meant to leave the machine, so that
          # is what the original must be absent from. The report's `value` and
          # `context` fields are local-only telemetry and deliberately DO carry
          # the original (see SpanFinding in runner.py) - asserting against the
          # whole document would be asserting against a documented decision.
          python3 - <<'PY'
          import json
          report = json.load(open("base-out.json"))
          for document in report["documents"]:
              assert "[EMAIL]" in document["overlay"], (
                  f"no redacted overlay in a base install: {document['overlay']!r}")
              assert "erika.mustermann@example.com" not in document["overlay"], (
                  f"the original survived into the overlay: {document['overlay']!r}")
          print("base install: CLI runs and the overlay carries no original")
          PY

  tests:
    needs: leak-gate
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      # 8 tests/test_simplifier.py cases patch privacy_shield.services.llm_runtime,
      # an upstream gateway this package does not ship. Deselected by name, not
      # by dropping the whole module, so the other tests in that file still run.
      # The `openai` extra is installed so
      # tests/test_local_model_endpoint_guard.py's send-path assertions run
      # rather than skip.
      - name: install and test
        run: |
          python3 -m pip install ".[dev,semantic,extract,openai]"
          python3 -m pytest -q \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_llm_simplification_success \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_llm_failure_returns_original \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_llm_empty_result_returns_original \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_llm_short_result_returns_original \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_llm_exception_returns_original \
            --deselect tests/test_simplifier.py::TestSimplifyResponseSync::test_german_language \
            --deselect tests/test_simplifier.py::TestSimplifyResponseAsync::test_async_simplification_success \
            --deselect tests/test_simplifier.py::TestSimplifyResponseAsync::test_async_failure_returns_original

  commit-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: commit discipline (new commits only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin ${{ github.base_ref }}
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }} -1"
          fi
          bad=0
          git log --no-merges --format='%s' $range | awk 'length($0)>72 {print "subject >72 chars: " $0; bad=1} END {exit bad}' || bad=1
          if git log --no-merges --format='%(trailers)' $range | grep -iE '^Co-Authored-By:.*(claude|codex|openai|anthropic|copilot|gemini)'; then
            echo "AI co-author trailer found — use the assisted line instead"; bad=1
          fi
          exit $bad
